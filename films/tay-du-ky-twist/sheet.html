<!doctype html><html><head><meta charset="utf-8"><title>cast sheet</title>
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#2a2018;color:#f4ead4;font-family:"Be Vietnam Pro"}canvas{display:block}#wrap{width:1920px;height:1080px;position:relative}#ov{position:absolute;left:0;top:0}</style>
</head><body><div id="wrap"><canvas id="ov" width="1920" height="1080"></canvas></div>
<script type="module">
import { drawFigure } from './figures.js';
import * as P from './props.js';
const ov = document.getElementById('ov'), x = ov.getContext('2d');
await Promise.all(['700 40px Fredoka','800 40px "Be Vietnam Pro"','400 40px "Be Vietnam Pro"'].map(f => document.fonts.load(f, 'Ầữộợẩ')));
x.fillStyle = '#2a2018'; x.fillRect(0,0,1920,1080);
const c = document.createElement('canvas');
function fig(kind, px, py, h, p={}) {
  c.width = 900; c.height = 1160;
  drawFigure(c.getContext('2d'), { kind, ...p });
  x.drawImage(c, px, py, h * 900 / 1160, h);
  x.fillStyle = '#f4ead4'; x.font = '600 26px "Be Vietnam Pro"'; x.textAlign = 'center';
  x.fillText(kind, px + h * 900 / 1160 / 2, py + h + 32);
}
fig('monk', 40, 40, 330, { prop: 'staff' });
fig('monkey', 300, 40, 330, { prop: 'staff' });
fig('pig', 560, 40, 330, { prop: 'rake' });
fig('sand', 820, 40, 330, { prop: 'spade' });
fig('guan', 1080, 40, 330, { prop: 'vase' });
fig('buddha', 1340, 40, 330, { prop: 'fan' });
fig('laozi', 1600, 40, 330, { prop: 'whisk' });
fig('demon', 40, 470, 280, { mouth: 'grin' });
fig('demon', 300, 470, 280, { pal: { robe: '#3f5f7a', robeS: '#2a4257', skin: '#c98f5e', skinS: '#a86f45' }, mouth: 'o' });
fig('official', 560, 470, 280);
fig('attend', 820, 470, 280, { mouth: 'grin' });
fig('monkey', 1080, 470, 280, { face: 'back' });
// props row
const items = [['mountain', P.mountain(.16,.075,'#b5a37a','#9a8660',3)], ['pagoda', P.pagoda(.09)], ['hall', P.hall(.2,.11)], ['lotus', P.lotus(.03)], ['cloud', P.cloud(.1,2)], ['sun', P.sunDisc(.03)], ['register', P.register(.28,.1,80)], ['scroll', P.scroll(.05,.015,true)], ['bowl', P.bowl(.02)], ['tag', P.tag(.06,.018,'LÃO TỬ')], ['stamp', P.stamp(.025)], ['boat', P.boat(.1)], ['turtle', P.turtle(.08)], ['shelf', P.shelf(.3,.1)], ['gate', P.gate(.14,.1)], ['band', P.band(.03)], ['corpse', P.corpse(.05)], ['tear', P.tear(.08,.06)]];
let px = 40, py = 900;
for (const [name, it] of items) {
  const h = 120, w = h * it.w / it.h;
  x.drawImage(it.c, px, py - h, w, h);
  x.fillStyle = '#f4ead4'; x.font = '500 18px "Be Vietnam Pro"'; x.textAlign = 'left'; x.fillText(name, px, py + 20);
  px += w + 26; if (px > 1800) { px = 40; py += 170; }
}
window.READY = true;
</script></body></html>
